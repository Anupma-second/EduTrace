server.port=${PORT:8080}

# Default: embedded H2 file database so the prototype runs with no setup.
# Use the "mysql" profile (application-mysql.properties) to run on MySQL.
spring.datasource.url=jdbc:h2:file:./data/sdms;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Prototype secrets - replace for any real deployment.
app.jwt.secret=prototype-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz
app.jwt.ttl-minutes=120
app.signing.secret=prototype-signing-secret-change-me-9876543210
app.cors-origins=http://localhost:5173,http://127.0.0.1:5173
app.frontend-url=http://localhost:5173

# Fixed one-time code used for every sign-in and verification (6 digits). Empty = random codes.
app.otp.fixed-code=482915

# 0 = derive from today's date (admissions year starts in June)
app.current-admission-year=0

logging.level.org.hibernate.SQL=WARN